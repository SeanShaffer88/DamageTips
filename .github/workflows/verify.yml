name: Verify DamageTips

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Expected version tag for the checked-out commit (for example v1.6.2)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.1
          lua5.1 -v
      - name: Run Lua mock suites
        run: |
          for suite in tests/*.lua; do
            lua5.1 "$suite" .
          done
      - name: Run Python tests
        run: python3 -B -m unittest discover -s tests
      - name: Verify install ZIP
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            EXPECTED_TAG="$GITHUB_REF_NAME"
          fi
          artifact_dir="$RUNNER_TEMP/damagetips-release"
          mkdir -- "$artifact_dir"
          python3 -B tools/verify_release.py --tag "$EXPECTED_TAG" --output "$artifact_dir/install.zip"
          zip_name="DamageTips-${EXPECTED_TAG#v}.zip"
          cd -- "$artifact_dir"
          mv -- install.zip "$zip_name"
          sha256sum -- "$zip_name" > "$zip_name.sha256"
      - name: Upload verified install ZIP and checksum
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DamageTips-${{ github.event_name == 'push' && 'tag' || 'preview' }}-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/damagetips-release/*.zip
            ${{ runner.temp }}/damagetips-release/*.zip.sha256
          if-no-files-found: error
          compression-level: 0
