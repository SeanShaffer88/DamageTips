name: Verify DamageTips

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Expected version tag for the checked-out commit (for example v1.6.2)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.1
          lua5.1 -v
      - name: Run Lua mock suites
        run: |
          for suite in tests/*.lua; do
            lua5.1 "$suite" .
          done
      - name: Run Python tests
        run: python3 -B -m unittest discover -s tests
      - name: Verify install ZIP
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            EXPECTED_TAG="$GITHUB_REF_NAME"
          fi
          python3 -B tools/verify_release.py --tag "$EXPECTED_TAG" --output "$RUNNER_TEMP/DamageTips.zip"
